name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Run lint
        if: hashFiles('package.json') != ''
        run: npm run lint

      - name: Run typecheck
        if: hashFiles('package.json') != ''
        run: npm run typecheck

      - name: Run tests
        if: hashFiles('package.json') != ''
        run: npm test